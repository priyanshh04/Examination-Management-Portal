<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMP | Notifications</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script></head><body class="bg-light"><main id="app" class="container py-4"><div class="d-flex justify-content-between mb-4"><div><h2>Notifications</h2><p class="text-muted">Updates about bookings, evaluations, and published results.</p></div><a href="/" class="btn btn-outline-secondary">Back to portal</a></div><div class="card"><div v-if="!items.length" class="p-5 text-center text-muted">You have no notifications.</div><div v-for="n in items" :key="n.id" class="p-3 border-bottom"><b>{{n.title}}</b><div>{{n.message}}</div><small class="text-muted">{{n.created_at}}</small><button v-if="!n.read" class="btn btn-sm btn-outline-primary float-end" @click="markRead(n)">Mark read</button></div></div></main><script>const{createApp}=Vue;createApp({data:()=>({items:[]}),async mounted(){await this.load()},methods:{async load(){try{const r=await fetch('/api/notifications');const j=await r.json();if(j.ok)this.items=j.data}catch(e){}},async markRead(n){const r=await fetch('/api/notifications/'+n.id+'/read',{method:'POST'});const j=await r.json();if(j.ok)n.read=1}}}).mount('#app')</script></body></html>
