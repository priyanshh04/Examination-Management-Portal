<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMP | Evaluations</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script><style>body{background:#f5f7fb}.card{border:0;box-shadow:0 4px 18px #0f172a12}.hero{background:linear-gradient(120deg,#17345d,#1685a7);color:#fff}</style></head><body><main id="app" class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2>Evaluation workspace</h2><p class="text-muted mb-0">Review assigned students and submit rubric-based marks.</p></div><a href="/" class="btn btn-outline-secondary">Back to portal</a></div><div v-if="error" class="alert alert-danger">{{error}}</div><div v-if="!me" class="card p-4 col-lg-5"><h5>Sign in as examiner</h5><input v-model="loginForm.email" class="form-control mb-2" placeholder="Email"><input v-model="loginForm.password" type="password" class="form-control mb-3" placeholder="Password"><button class="btn btn-primary" @click="login">Sign in</button></div><div v-else class="row g-4"><div class="col-lg-5"><div class="card p-3"><h5>Pending evaluations</h5><div v-if="!pending.length" class="text-muted py-4 text-center">No pending evaluations.</div><button v-for="x in pending" :key="x.booking_id" class="btn btn-light text-start w-100 mb-2" @click="select(x.booking_id)"><b>{{x.student}}</b><br><span class="small text-muted">{{x.examination}} · {{x.date}} {{x.start_time}}</span></button></div></div><div class="col-lg-7"><div v-if="form" class="card p-4"><div class="hero rounded p-3 mb-3"><h5 class="mb-1">{{form.student}}</h5><div>{{form.examination}}</div></div><div v-for="(r,i) in form.rubrics" :key="r.id" class="border rounded p-3 mb-2"><div class="d-flex justify-content-between"><b>{{r.criterion}}</b><span>Max {{r.max_marks}}</span></div><input v-model.number="details[i].marks" type="number" min="0" :max="r.max_marks" class="form-control mt-2" placeholder="Marks awarded"><input v-model="details[i].comments" class="form-control mt-2" placeholder="Criterion comments"></div><textarea v-model="remarks" class="form-control my-3" rows="3" placeholder="Overall remarks"></textarea><button class="btn btn-primary" @click="submit">Submit evaluation</button></div><div v-else class="card p-5 text-center text-muted">Select a pending student to begin.</div></div></div></main><script>const{createApp}=Vue;createApp({data:()=>({me:null,loginForm:{},pending:[],form:null,details:[],remarks:'',error:''}),async mounted(){try{this.me=await this.api('/auth/me');if(this.me.role!=='examiner')this.error='This page is available to examiners only';else this.load()}catch(_){}},methods:{async api(u,o={}){const r=await fetch('/api'+u,{headers:{'Content-Type':'application/json'},...o});const j=await r.json();if(!j.ok)throw Error(j.error);return j.data},async login(){try{this.me=(await this.api('/auth/login',{method:'POST',body:JSON.stringify(this.loginForm)})).user;await this.load()}catch(e){this.error=e.message}},async load(){this.pending=await this.api('/evaluations/pending')},async select(id){try{this.form=await this.api('/evaluations/'+id);this.details=this.form.rubrics.map(r=>({rubric_id:r.id,marks:0,comments:''}))}catch(e){this.error=e.message}},async submit(){try{await this.api('/evaluations',{method:'POST',body:JSON.stringify({booking_id:this.form.booking_id,details:this.details,remarks:this.remarks})});this.form=null;this.remarks='';await this.load()}catch(e){this.error=e.message}}}}).mount('#app')</script></body></html>
