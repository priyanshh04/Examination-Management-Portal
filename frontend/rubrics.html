<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMP | Rubrics</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script></head><body class="bg-light"><main id="app" class="container py-4"><div class="d-flex justify-content-between mb-4"><div><h2>Rubric management</h2><p class="text-muted">Define criteria and maximum marks for each examination.</p></div><a href="/" class="btn btn-outline-secondary">Back to portal</a></div><div v-if="error" class="alert alert-danger">{{error}}</div><div class="card p-4"><div class="row g-2"><div class="col-md-3"><input v-model="examId" class="form-control" placeholder="Examination ID"></div><div class="col-md-3"><input v-model="newRubric.criterion" class="form-control" placeholder="Criterion"></div><div class="col-md-2"><input v-model.number="newRubric.max_marks" type="number" class="form-control" placeholder="Max marks"></div><div class="col-md-2"><input v-model="newRubric.description" class="form-control" placeholder="Description"></div><div class="col-md-2"><button class="btn btn-primary w-100" @click="add">Add criterion</button></div></div><button class="btn btn-link px-0 mt-3" @click="load">Load rubric</button><table v-if="rubrics.length" class="table mt-2"><thead><tr><th>Criterion</th><th>Max marks</th><th>Weightage</th><th></th></tr></thead><tbody><tr v-for="r in rubrics" :key="r.id"><td>{{r.criterion}}<div class="small text-muted">{{r.description}}</div></td><td>{{r.max_marks}}</td><td>{{r.weightage}}%</td><td><button class="btn btn-sm btn-outline-danger" @click="remove(r.id)">Remove</button></td></tr></tbody></table></div></main><script>const{createApp}=Vue;createApp({data:()=>({examId:'',rubrics:[],newRubric:{},error:''}),methods:{async api(u,o={}){const r=await fetch('/api'+u,{headers:{'Content-Type':'application/json'},...o});const j=await r.json();if(!j.ok)throw Error(j.error);return j.data},async load(){try{this.rubrics=await this.api('/rubrics/'+this.examId)}catch(e){this.error=e.message}},async add(){try{await this.api('/rubrics',{method:'POST',body:JSON.stringify({...this.newRubric,examination_id:Number(this.examId)})});this.newRubric={};await this.load()}catch(e){this.error=e.message}},async remove(id){try{await this.api('/rubrics/'+id,{method:'DELETE'});await this.load()}catch(e){this.error=e.message}}}}).mount('#app')</script></body></html>
