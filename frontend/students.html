<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMP | Students</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script></head><body class="bg-light"><main id="app" class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2>Student management</h2><p class="text-muted mb-0">Registered students and account status.</p></div><a class="btn btn-outline-secondary" href="/">Back to portal</a></div><div class="card p-4"><div class="input-group mb-3"><input class="form-control" v-model="query" @input="load" placeholder="Search name or email"><button class="btn btn-outline-secondary" @click="load">Search</button></div><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Contact</th><th>Registered</th><th>Status</th><th>Action</th></tr></thead><tbody><tr v-for="s in students" :key="s.id"><td>{{s.name}}</td><td>{{s.email}}</td><td>{{s.contact||'—'}}</td><td>{{s.created_at}}</td><td><span class="badge" :class="s.status==='Active'?'text-bg-success':'text-bg-secondary'">{{s.status}}</span></td><td><button class="btn btn-sm" :class="s.status==='Active'?'btn-outline-danger':'btn-outline-success'" @click="toggle(s)">{{s.status==='Active'?'Deactivate':'Activate'}}</button></td></tr><tr v-if="!students.length"><td colspan="6" class="text-center text-muted py-4">No students found.</td></tr></tbody></table></div></div></main><script>const{createApp}=Vue;createApp({data:()=>({students:[],query:''}),async mounted(){this.load()},methods:{async load(){let r=await fetch('/api/users?role=student&q='+encodeURIComponent(this.query));let j=await r.json();if(j.ok)this.students=j.data},async toggle(s){let r=await fetch('/api/users/'+s.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.status==='Active'?'Inactive':'Active'})});let j=await r.json();if(j.ok)this.load()}}}).mount('#app')</script></body></html>
